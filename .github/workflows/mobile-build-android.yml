name: Build Android App

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API Base URL (e.g., https://x.tkdan.cn)'
        required: true
        default: 'https://x.tkdan.cn'
        type: string
      app_version:
        description: 'App Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: ./front
        run: pnpm install --no-workspace-root

      - name: Build frontend with API base URL
        working-directory: ./front
        env:
          NUXT_PUBLIC_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: pnpm run generate

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Copy keystore to Android project
        run: |
          cp release.keystore android/app/release.keystore

      - name: Build Android APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moments-${{ github.event.inputs.app_version }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.app_version }}
          name: Moments Android v${{ github.event.inputs.app_version }}
          body: |
            ## Moments Android App v${{ github.event.inputs.app_version }}

            **API Base URL:** ${{ github.event.inputs.api_base_url }}

            ### Installation
            Download the APK file below and install it on your Android device.

            ### Changes
            - Built from commit: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
